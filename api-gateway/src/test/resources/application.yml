gateway:
  path:
    public: /api/v1/auth/
    internal: /api/v1/internal/

spring:
  config:
    import: optional:configserver:http://config-service:8888

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**

        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/**, /api/v1/admin/products/**

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**, /api/v1/admin/orders/**

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**
security:
  internal-api-key: ${SECURITY_INTERNAL_API_KEY}